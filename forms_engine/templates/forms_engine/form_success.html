<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>

        Submitted

    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>

        body{

            background:#f1f5f9;

            height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            font-family:Arial, sans-serif;
        }

        .success-card{

            width:100%;

            max-width:500px;

            background:white;

            border:none;

            border-radius:24px;

            padding:50px;

            text-align:center;
        }

        .success-icon{

            width:90px;

            height:90px;

            background:#22c55e;

            border-radius:50%;

            display:flex;

            justify-content:center;

            align-items:center;

            margin:auto;

            margin-bottom:30px;
        }

        .success-icon i{

            color:white;

            font-size:40px;
        }

        .title{

            font-size:32px;

            font-weight:700;

            margin-bottom:15px;

            color:#0f172a;
        }

        .message{

            color:#64748b;

            font-size:17px;

            margin-bottom:35px;
        }

        .dashboard-btn{

            background:#2563eb;

            border:none;

            border-radius:12px;

            padding:14px 35px;

            font-weight:600;

            font-size:16px;
        }

        .dashboard-btn:hover{

            background:#1d4ed8;
        }

    </style>

</head>

<body>

<div class="success-card shadow">

    <div class="success-icon">

        <i class="fa-solid fa-check"></i>

    </div>

    <div class="title">

        Submitted Successfully

    </div>

    <div class="message">

        Thank you {{ username }}

    </div>

    {% if form_type == 'private' %}

        <a
            href="/accounts/student-dashboard/"
            class="btn btn-primary dashboard-btn"
        >

            Back To Dashboard

        </a>

    {% else %}

        <a
            href="/"
            class="btn btn-primary dashboard-btn"
        >

            Close

        </a>

    {% endif %}

</div>

</body>

</html>
