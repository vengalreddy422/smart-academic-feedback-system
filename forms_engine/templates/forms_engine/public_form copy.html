<!DOCTYPE html>
<html>

<head>

    <title>{{ form.title }}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body>

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-body">

            <h1>
                {{ form.title }}
            </h1>

            <p>
                {{ form.description }}
            </p>

            <form method="POST">

                {% csrf_token %}

                <div class="mb-3">

                    <label>Name</label>

                    <input
                        type="text"
                        name="name"
                        class="form-control"
                    >

                </div>

                <div class="mb-3">

                    <label>Email</label>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                    >

                </div>

                {% for question in questions %}

                <div class="mb-3">

                    <label>

                        {{ question.question }}

                    </label>

                    <input
                        type="text"
                        name="{{ question.id }}"
                        class="form-control"
                    >

                </div>

                {% endfor %}

                <button
                    type="submit"
                    class="btn btn-success"
                >
                    Submit
                </button>

            </form>

        </div>

    </div>

</div>

</body>

</html>
