<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>

        {{ form.title }}

    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>

        *{

            margin:0;

            padding:0;

            box-sizing:border-box;
        }

        body{

            background:
            linear-gradient(
                135deg,
                #eef2ff,
                #f8fafc
            );

            min-height:100vh;

            font-family:
            'Segoe UI',
            sans-serif;

            display:flex;

            justify-content:center;

            align-items:center;

            padding:40px 20px;
        }

        .main-card{

            width:100%;

            max-width:1150px;

            background:white;

            border-radius:30px;

            overflow:hidden;

            box-shadow:
            0px 20px 60px rgba(15,23,42,0.12);
        }

        .left-section{

            background:
            linear-gradient(
                135deg,
                #2563eb,
                #1d4ed8
            );

            color:white;

            padding:70px 50px;

            height:100%;

            display:flex;

            flex-direction:column;

            justify-content:center;
        }

        .logo-box{

            width:85px;

            height:85px;

            border-radius:24px;

            background:rgba(255,255,255,0.15);

            display:flex;

            justify-content:center;

            align-items:center;

            margin-bottom:35px;
        }

        .logo-box i{

            font-size:38px;
        }

        .left-title{

            font-size:40px;

            font-weight:700;

            line-height:55px;

            margin-bottom:20px;
        }

        .left-description{

            font-size:17px;

            color:#dbeafe;

            line-height:30px;
        }

        .feature-list{

            margin-top:50px;
        }

        .feature-item{

            display:flex;

            align-items:center;

            gap:14px;

            margin-bottom:18px;
        }

        .feature-icon{

            width:42px;

            height:42px;

            border-radius:12px;

            background:rgba(255,255,255,0.15);

            display:flex;

            justify-content:center;

            align-items:center;
        }

        .right-section{

            padding:60px 50px;
        }

        .top-heading{

            font-size:34px;

            font-weight:700;

            color:#0f172a;

            margin-bottom:10px;
        }

        .top-subtitle{

            color:#64748b;

            margin-bottom:40px;
        }

        .question-card{

            border:1px solid #e2e8f0;

            border-radius:22px;

            padding:28px;

            margin-bottom:28px;

            transition:0.3s;
        }

        .question-card:hover{

            border-color:#2563eb;

            box-shadow:
            0px 10px 25px rgba(37,99,235,0.08);
        }

        .form-label{

            font-weight:700;

            margin-bottom:12px;

            color:#0f172a;
        }

        .form-control,
        .form-select{

            height:54px;

            border-radius:16px;

            border:1px solid #cbd5e1;

            padding-left:18px;

            font-size:15px;

            box-shadow:none;
        }

        textarea.form-control{

            height:auto;
        }

        .form-control:focus,
        .form-select:focus{

            border-color:#2563eb;

            box-shadow:
            0px 0px 0px 4px rgba(37,99,235,0.1);
        }

        .option-card{

            border:1px solid #dbe2ea;

            border-radius:16px;

            padding:14px 18px;

            margin-bottom:14px;

            background:#f8fafc;

            transition:0.3s;
        }

        .option-card:hover{

            background:#eff6ff;

            border-color:#2563eb;
        }

        .form-check-label{

            margin-left:8px;

            font-weight:500;
        }

        .error-box{

            display:none;

            margin-top: 10px;

            background: #fef2f2;

            border: 1px solid #fecaca;

            color:#b91c1c;

            padding: 10px 14px;

            border-radius: 12px;

            font-size:14px;

            font-weight: 500;
        }

        .submit-btn{

            width:100%;

            height:58px;

            border:none;

            border-radius:18px;

            background:
            linear-gradient(
                135deg,
                #2563eb,
                #3b82f6
            );

            color:white;

            font-size:18px;

            font-weight:700;

            transition:0.3s;
        }

        .submit-btn:hover{

            transform:translateY(-2px);

            box-shadow:
            0px 15px 30px rgba(37,99,235,0.3);
        }

        @media(max-width:991px){

            .left-section{

                padding:45px 30px;
            }

            .right-section{

                padding:40px 25px;
            }

            .left-title{

                font-size:32px;

                line-height:45px;
            }

            .top-heading{

                font-size:28px;
            }
        }
        /* Make sure the date input looks like a text input on mobile */
input[type="date"] {
    appearance: none;
    -webkit-appearance: none;
    padding: 18px;
}

/* This is a hack to show a placeholder-like label for dates on mobile */
input[type="date"]:invalid::before {
    content: attr(placeholder);
    color: #64748b;
}

input[type="date"]:focus::before {
    content: "" !important;
}
    </style>

</head>

<body>

<div class="main-card">

    <div class="row g-0">

        <div class="col-lg-5">

            <div class="left-section">

                <div class="logo-box">

                    <i class="fa-solid fa-file-lines"></i>

                </div>

                <div class="left-title">

                    {{ form.title }}

                </div>

                <div class="left-description">

                    {{ form.description }}

                </div>

                <div class="feature-list">

                    <div class="feature-item">

                        <div class="feature-icon">

                            <i class="fa-solid fa-mobile-screen"></i>

                        </div>

                        Mobile Friendly Form

                    </div>

                    <div class="feature-item">

                        <div class="feature-icon">

                            <i class="fa-solid fa-shield"></i>

                        </div>

                        Secure Submission

                    </div>

                    <div class="feature-item">

                        <div class="feature-icon">

                            <i class="fa-solid fa-chart-line"></i>

                        </div>

                        Real-Time Analytics

                    </div>

                </div>

            </div>

        </div>

        <div class="col-lg-7">

            <div class="right-section">

                <div class="top-heading">

                    Fill The Form

                </div>

                <div class="top-subtitle">

                    Complete all required information carefully.

                </div>

                <form
                    method="POST"
                    id="dynamicForm"
                    novalidate
                >

                    {% csrf_token %}

                    {% for question in questions %}

                            {% include 'forms_engine/_answer_widget.html' with question=question %}

                    {% endfor %}

                    <button
                        type="submit"
                        class="submit-btn"
                    >

                        <i class="fa-solid fa-paper-plane me-2"></i>

                        Submit Form

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

<script>
    const form = document.getElementById('dynamicForm');

    form.addEventListener('submit', function(event) {
        let valid = true;
        let firstInvalidInput = null;

        // ========================================================
        // 1. FORCE THE RED ERROR MESSAGES TO SHOW FOR NATIVE BLANK / INVALID FIELDS
        // ========================================================
        if (!form.checkValidity()) {
            event.preventDefault();
            event.stopPropagation();
            valid = false;
        }

        // Display or hide the error block based on validity status
        form.querySelectorAll('.form-control, .form-select').forEach(input => {
            const error = input.parentElement.querySelector('.error-box');
            const errorText = input.parentElement.querySelector('.error-text');
            
            if (error) {
                if (!input.checkValidity()) {
                    if (!firstInvalidInput) firstInvalidInput = input;
                    // Match standard text message to field requirements if empty
                    if (input.validity.valueMissing) {
                        if (input.tagName.toLowerCase() === 'select') {
                            if(errorText) errorText.innerText = 'Please select an option';
                        } else {
                            if(errorText) errorText.innerText = 'This field is required';
                        }
                    } else if (input.type === 'email' && input.validity.typeMismatch) {
                        if(errorText) errorText.innerText = 'Please enter valid email address';
                    }
                    error.style.display = 'block'; 
                } else {
                    error.style.display = 'none';  
                }
            }
        });

        // ========================================================
        // 2. CUSTOM PHONE VALIDATION
        // ========================================================
        const phoneInputs = document.querySelectorAll('.phone-input');
        phoneInputs.forEach(function(input) {
            const value = input.value.trim();
            const error = input.parentElement.querySelector('.phone-error');
            const allSame = /^(\d)\1+$/.test(value);

            if (input.hasAttribute('required') && value === '') {
                valid = false;
                if (!firstInvalidInput) firstInvalidInput = input;
                if (error) {
                    const errorText = error.querySelector('.error-text');
                    if(errorText) errorText.innerText = 'This field is required';
                    error.style.display = 'block';
                }
            } else if (value !== '') {
                if (value.length !== 10 || !/^\d+$/.test(value) || allSame) {
                    valid = false;
                    if (!firstInvalidInput) firstInvalidInput = input;
                    if (error) {
                        const errorText = error.querySelector('.error-text');
                        if(errorText) errorText.innerText = 'Enter valid 10-digit phone number';
                        error.style.display = 'block';
                    }
                }
            }
        });

        // ========================================================
        // 3. CUSTOM TEXT FIELD VALIDATION (NAME/COLLEGE/BRANCH)
        // ========================================================
        const textInputs = document.querySelectorAll('.text-input');
        textInputs.forEach(function(input) {
            const value = input.value.trim();
            const question = input.dataset.question ? input.dataset.question.toLowerCase() : '';
            const error = input.parentElement.querySelector('.text-error');
            let validText = true;

            if (input.hasAttribute('required') && value === '') {
                valid = false;
                if (!firstInvalidInput) firstInvalidInput = input;
                if (error) {
                    const errorText = error.querySelector('.error-text');
                    if(errorText) errorText.innerText = 'This field is required';
                    error.style.display = 'block';
                }
                return;
            }

            if (value !== '') {
                if (question.includes('college') || question.includes('branch') || question.includes('department') || question.includes('name')) {
                    validText = /^[A-Za-z ]+$/.test(value);
                }

                if (!validText) {
                    valid = false;
                    if (!firstInvalidInput) firstInvalidInput = input;
                    if (error) {
                        const errorText = error.querySelector('.error-text');
                        if (errorText) {
                            if (question.includes('college')) {
                                errorText.innerText = 'College name must contain only letters';
                            } else if (question.includes('branch') || question.includes('department')) {
                                errorText.innerText = 'Branch must contain only letters';
                            } else {
                                errorText.innerText = 'Name must contain only letters';
                            }
                        }
                        error.style.display = 'block';
                    }
                }
            }
        });

        // ========================================================
        // 4. CUSTOM DOB VALIDATION
        // ========================================================
        // ========================================================
        // 4. CUSTOM DOB VALIDATION
        // ========================================================
        const dobInputs = document.querySelectorAll('.dob-input');
        dobInputs.forEach(function(input) {
            const value = input.value;
            const error = input.parentElement.querySelector('.dob-error');

            if (input.hasAttribute('required') && value === '') {
                valid = false;
                if (!firstInvalidInput) firstInvalidInput = input;
                if (error) {
                    const errorText = error.querySelector('.error-text');
                    if(errorText) errorText.innerText = 'This field is required';
                    error.style.display = 'block';
                }
            } else if (value) {
                // Create date at midnight local time
                const selectedDate = new Date(value + 'T00:00:00');
                const today = new Date();
                today.setHours(0, 0, 0, 0); // Set time to midnight for accurate date comparison

                if (selectedDate > today) { // Changed to > to allow 'today'
                    valid = false;
                    if (!firstInvalidInput) firstInvalidInput = input;
                    if (error) {
                        const errorText = error.querySelector('.error-text');
                        if(errorText) errorText.innerText = 'Date cannot be in the future';
                        error.style.display = 'block';
                    }
                } else {
                    if (error) error.style.display = 'none';
                }
            }
        });

        // ========================================================
        // 5. BLOCK SUBMISSION IF ANY FIELD HAS FAILED
        // ========================================================
        if (firstInvalidInput) {
            firstInvalidInput.focus();
        }

        if (!valid) {
            event.preventDefault(); 
        }
    });
</script>

</body>

</html>
