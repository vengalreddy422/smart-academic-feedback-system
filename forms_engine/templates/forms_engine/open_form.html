<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>

        {{ form.title }}

    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{

        background:#eef2f7;

        font-family:'Outfit',sans-serif;

        color:#1e293b;
    }

    /* ==================================================
       MAIN CONTAINER
    ================================================== */

    .main-card{

        border:none;

        border-radius:24px;

        overflow:hidden;

        background:white;

        box-shadow:
            0 10px 40px rgba(15,23,42,0.06);
    }

    /* ==================================================
       HEADER
    ================================================== */

    .form-header{

        background:
            linear-gradient(
                135deg,
                #0f172a,
                #1e293b
            );

        padding:45px;

        color:white;
    }

    .form-title{

        font-size:36px;

        font-weight:800;

        margin-bottom:10px;
    }

    .form-description{

        color:rgba(255,255,255,0.75);

        font-size:15px;

        max-width:700px;
    }

    /* ==================================================
       FORM BODY
    ================================================== */

    .form-body{

        padding:40px;
    }

    /* ==================================================
       QUESTION BLOCK
    ================================================== */

    .question-box{

        margin-bottom:28px;
    }

    .question-label{

        font-size:16px;

        font-weight:700;

        margin-bottom:12px;

        color:#0f172a;

        display:flex;

        align-items:center;

        gap:8px;
    }

    .required-star{

        color:#ef4444;

        font-size:18px;
    }

    /* ==================================================
       LOCKED FIELDS (PENDING UPDATE)
    ================================================== */
    .answered-locked {
        opacity: 0.75;
    }
    
    .answered-locked .form-control,
    .answered-locked .form-select,
    .answered-locked .form-check-input {
        background-color: #e9ecef !important;
        cursor: not-allowed;
    }
    .answered-locked label.form-check-label {
        cursor: not-allowed;
    }

    /* ==================================================
       INPUTS
    ================================================== */

    .form-control,
    .form-select{

        height:54px;

        border-radius:14px;

        border:1px solid #dbe2ea;

        background:#f8fafc;

        font-size:15px;

        padding-left:16px;

        transition:0.3s;

        box-shadow:none;
    }

    textarea.form-control{

        height:auto;

        padding-top:14px;
    }

    .form-control:focus,
    .form-select:focus{

        background:white;

        border-color:#2563eb;

        box-shadow:
            0 0 0 4px rgba(37,99,235,0.08);
    }

    /* ==================================================
       OPTIONS
    ================================================== */

    .option-box{

        background:#f8fafc;

        border:1px solid #e2e8f0;

        border-radius:14px;

        padding:14px 16px;

        margin-bottom:12px;

        transition:0.2s;
    }

    .option-box:hover{

        border-color:#2563eb;

        background:white;
    }

    .form-check-input{

        width:18px;

        height:18px;

        cursor:pointer;
    }

    .form-check-label{

        margin-left:8px;

        font-size:15px;

        cursor:pointer;
    }

    /* ==================================================
       ERROR ALERT SYSTEM (Frontend-Driven)
    ================================================== */

    .error-box {
        display: none; /* Hidden by default */
        margin-top: 10px;
        background: #fef2f2;
        border: 1px solid #fecaca;
        color: #b91c1c;
        padding: 10px 14px;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 500;
    }

    /* Show the red alert box instantly if the user types an invalid value and tries to submit */
    .was-validated .question-box:has(.form-control:invalid) .error-box,
    .was-validated .question-box:has(.form-select:invalid) .error-box,
    .was-validated .question-box:has(.form-check-input:invalid) .error-box {
        display: block !important;
    }
    
    /* Turn input borders red on invalid entry */
    .was-validated .form-control:invalid,
    .was-validated .form-select:invalid {
        border-color: #ef4444;
        background-color: #fff5f5;
    }

    /* ==================================================
       BUTTON
    ================================================== */

    .submit-btn{

        width:100%;

        height:58px;

        border:none;

        border-radius:16px;

        background:
            linear-gradient(
                135deg,
                #2563eb,
                #1d4ed8
            );

        color:white;

        font-size:17px;

        font-weight:700;

        transition:0.3s;
    }

    .submit-btn:hover{

        transform:translateY(-2px);

        box-shadow:
            0 12px 25px rgba(37,99,235,0.18);
    }

    /* ==================================================
       MOBILE
    ================================================== */

    @media(max-width:768px){

        .form-header{

            padding:30px 24px;
        }

        .form-title{

            font-size:28px;
        }

        .form-body{

            padding:24px;
        }

        .question-label{

            font-size:15px;
        }
    }

</style>

</head>

<body>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-9">

            <div class="card main-card">

                <div class="form-header">

                    <h1 class="form-title">

                        {{ form.title }}

                    </h1>

                    <p class="form-description">

                        {{ form.description }}

                    </p>

                </div>

                <div class="form-body">

                    <form
                        method="POST"
                        action="/forms/submit-form/{{ form.id }}/"
                        class="needs-validation"
                        novalidate
                    >

                        {% csrf_token %}

                        {% for question in questions %}
                            {% include 'forms_engine/_answer_widget.html' with question=question %}
                        {% endfor %}

                        <button
                            type="submit"
                            class="submit-btn"
                        >

                            <i class="bi bi-send-fill"></i>

                            Submit Form

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<script>
    const formConditions = {{ conditions_json|safe }};
    
    function evaluateCondition(cond) {
        const parentBlock = document.getElementById('question-block-' + cond.parent_question_id);
        if (!parentBlock) return false;
        
        let val = '';
        // Find inputs in parent block
        const textInput = parentBlock.querySelector('input[type="text"], input[type="email"], input[type="number"], input[type="tel"], input[type="date"], textarea');
        const select = parentBlock.querySelector('select');
        const checkedBoxes = parentBlock.querySelectorAll('input[type="checkbox"]:checked');
        const checkedRadio = parentBlock.querySelector('input[type="radio"]:checked');
        
        if (textInput) val = textInput.value;
        else if (select) val = select.value;
        else if (checkedBoxes.length > 0) val = Array.from(checkedBoxes).map(cb => cb.value).join(',');
        else if (checkedRadio) val = checkedRadio.value;
        
        if (cond.operator === 'equals') return val === cond.trigger_value;
        if (cond.operator === 'not_equals') return val !== cond.trigger_value;
        if (cond.operator === 'contains') return val.includes(cond.trigger_value);
        if (cond.operator === 'greater_than') return parseFloat(val) > parseFloat(cond.trigger_value);
        if (cond.operator === 'less_than') return parseFloat(val) < parseFloat(cond.trigger_value);
        
        return false;
    }

    function applyConditions() {
        // Group conditions by question
        const conditionsByQuestion = {};
        formConditions.forEach(cond => {
            if (!conditionsByQuestion[cond.question_id]) {
                conditionsByQuestion[cond.question_id] = [];
            }
            conditionsByQuestion[cond.question_id].push(cond);
        });

        // Apply rules
        for (const [qId, conds] of Object.entries(conditionsByQuestion)) {
            const targetBlock = document.getElementById('question-block-' + qId);
            if (!targetBlock) continue;

            // Simplified: if ANY condition is met, apply action, else revert
            let isActive = false;
            let action = conds[0].action; // Assume all conditions for a field have same action for simplicity
            
            // Assume AND for multiple conditions
            isActive = conds.every(evaluateCondition);
            
            const inputs = targetBlock.querySelectorAll('.form-control, .form-select, .form-check-input');
            const originallyRequired = targetBlock.getAttribute('data-is-required') === 'true';

            if (isActive) {
                if (action === 'show' || action === 'require') {
                    targetBlock.classList.remove('d-none');
                    if (action === 'require' || originallyRequired) {
                        inputs.forEach(i => i.setAttribute('required', 'required'));
                        // Optionally show star
                    }
                } else if (action === 'hide') {
                    targetBlock.classList.add('d-none');
                    inputs.forEach(i => i.removeAttribute('required'));
                    inputs.forEach(i => {
                        if (i.type === 'checkbox' || i.type === 'radio') i.checked = false;
                        else i.value = '';
                    });
                }
            } else {
                if (action === 'show' || action === 'require') {
                    targetBlock.classList.add('d-none');
                    inputs.forEach(i => i.removeAttribute('required'));
                    inputs.forEach(i => {
                        if (i.type === 'checkbox' || i.type === 'radio') i.checked = false;
                        else i.value = '';
                    });
                } else if (action === 'hide') {
                    targetBlock.classList.remove('d-none');
                    if (originallyRequired) {
                        inputs.forEach(i => i.setAttribute('required', 'required'));
                    }
                }
            }
        }
    }

    // Bind change events
    document.querySelectorAll('.form-control, .form-select, .form-check-input').forEach(input => {
        input.addEventListener('input', applyConditions);
        input.addEventListener('change', applyConditions);
    });
    
    // Initial apply
    applyConditions();

    (() => {
        'use strict'
        const forms = document.querySelectorAll('.needs-validation')
        Array.from(forms).forEach(form => {
            form.addEventListener('submit', event => {
                let firstInvalidInput = null;
                if (!form.checkValidity()) {
                    event.preventDefault()
                    event.stopPropagation()
                }

                form.querySelectorAll('.form-control, .form-select, .form-check-input').forEach(input => {
                    const questionBox = input.closest('.question-box');
                    if (questionBox) {
                        const errorText = questionBox.querySelector('.error-text');
                        const labelEl = questionBox.querySelector('.question-label');
                        let label = 'this field';
                        if (labelEl) {
                            label = labelEl.innerText.replace('*', '').trim();
                        }
                        
                        if (errorText && !input.checkValidity()) {
                            if (!firstInvalidInput) {
                                firstInvalidInput = input;
                            }
                            if (input.validity.valueMissing) {
                                errorText.innerText = 'This field is required';
                            } else if (input.type === 'email' && input.validity.typeMismatch) {
                                errorText.innerText = 'Please enter a valid email address';
                            } else if (input.pattern) {
                                if (input.type === 'tel') {
                                    errorText.innerText = 'Please enter a valid 10-digit mobile number';
                                } else if (input.name && input.placeholder && input.placeholder.includes('PAN')) {
                                    errorText.innerText = 'Please enter a valid PAN number';
                                } else if (input.name && input.placeholder && input.placeholder.includes('Aadhaar')) {
                                    errorText.innerText = 'Please enter a valid 12-digit Aadhaar number';
                                } else if (input.name && input.placeholder && input.placeholder.includes('APAAR')) {
                                    errorText.innerText = 'Please enter a valid 12-digit APAAR ID';
                                } else {
                                    errorText.innerText = 'Your value is wrong, choose another';
                                }
                            } else {
                                errorText.innerText = 'Your value is wrong, choose another';
                            }
                        }
                    }
                });
                
                if (firstInvalidInput) {
                    firstInvalidInput.focus();
                }

                form.classList.add('was-validated');
            }, false)
        })
    })()

    // ==========================================
    // LOCK ANSWERED FIELDS
    // ==========================================
    document.querySelectorAll('.answered-locked .form-control, .answered-locked .form-select, .answered-locked .form-check-input').forEach(el => {
        el.setAttribute('readonly', 'readonly');
        el.setAttribute('tabindex', '-1');
        
        // Prevent mouse and keyboard interactions
        el.addEventListener('mousedown', e => e.preventDefault());
        el.addEventListener('click', e => e.preventDefault());
        el.addEventListener('keydown', e => e.preventDefault());
    });
    
    // Prevent clicking on option labels too
    document.querySelectorAll('.answered-locked label.form-check-label').forEach(el => {
        el.addEventListener('click', e => e.preventDefault());
        el.addEventListener('mousedown', e => e.preventDefault());
    });
</script>

</body>

</html>
