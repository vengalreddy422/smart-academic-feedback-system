<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>

        {{ form.title }}

    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{

        background:#eef2f7;

        font-family:'Outfit',sans-serif;

        color:#1e293b;
    }

    /* ==================================================
       MAIN CONTAINER
    ================================================== */

    .main-card{

        border:none;

        border-radius:24px;

        overflow:hidden;

        background:white;

        box-shadow:
            0 10px 40px rgba(15,23,42,0.06);
    }

    /* ==================================================
       HEADER
    ================================================== */

    .form-header{

        background:
            linear-gradient(
                135deg,
                #0f172a,
                #1e293b
            );

        padding:45px;

        color:white;
    }

    .form-title{

        font-size:36px;

        font-weight:800;

        margin-bottom:10px;
    }

    .form-description{

        color:rgba(255,255,255,0.75);

        font-size:15px;

        max-width:700px;
    }

    /* ==================================================
       FORM BODY
    ================================================== */

    .form-body{

        padding:40px;
    }

    /* ==================================================
       QUESTION BLOCK
    ================================================== */

    .question-box{

        margin-bottom:28px;
    }

    .question-label{

        font-size:16px;

        font-weight:700;

        margin-bottom:12px;

        color:#0f172a;

        display:flex;

        align-items:center;

        gap:8px;
    }

    .required-star{

        color:#ef4444;

        font-size:18px;
    }

    /* ==================================================
       INPUTS
    ================================================== */

    .form-control,
    .form-select{

        height:54px;

        border-radius:14px;

        border:1px solid #dbe2ea;

        background:#f8fafc;

        font-size:15px;

        padding-left:16px;

        transition:0.3s;

        box-shadow:none;
    }

    textarea.form-control{

        height:auto;

        padding-top:14px;
    }

    .form-control:focus,
    .form-select:focus{

        background:white;

        border-color:#2563eb;

        box-shadow:
            0 0 0 4px rgba(37,99,235,0.08);
    }

    /* ==================================================
       OPTIONS
    ================================================== */

    .option-box{

        background:#f8fafc;

        border:1px solid #e2e8f0;

        border-radius:14px;

        padding:14px 16px;

        margin-bottom:12px;

        transition:0.2s;
    }

    .option-box:hover{

        border-color:#2563eb;

        background:white;
    }

    .form-check-input{

        width:18px;

        height:18px;

        cursor:pointer;
    }

    .form-check-label{

        margin-left:8px;

        font-size:15px;

        cursor:pointer;
    }

    /* ==================================================
       ERROR ALERT SYSTEM (Frontend-Driven)
    ================================================== */

    .error-box {
        display: none; /* Hidden by default */
        margin-top: 10px;
        background: #fef2f2;
        border: 1px solid #fecaca;
        color: #b91c1c;
        padding: 10px 14px;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 500;
    }

    /* Show the red alert box instantly if the user types an invalid value and tries to submit */
    .was-validated .question-box:has(.form-control:invalid) .error-box,
    .was-validated .question-box:has(.form-select:invalid) .error-box,
    .was-validated .question-box:has(.form-check-input:invalid) .error-box {
        display: block !important;
    }
    
    /* Turn input borders red on invalid entry */
    .was-validated .form-control:invalid,
    .was-validated .form-select:invalid {
        border-color: #ef4444;
        background-color: #fff5f5;
    }

    /* ==================================================
       BUTTON
    ================================================== */

    .submit-btn{

        width:100%;

        height:58px;

        border:none;

        border-radius:16px;

        background:
            linear-gradient(
                135deg,
                #2563eb,
                #1d4ed8
            );

        color:white;

        font-size:17px;

        font-weight:700;

        transition:0.3s;
    }

    .submit-btn:hover{

        transform:translateY(-2px);

        box-shadow:
            0 12px 25px rgba(37,99,235,0.18);
    }

    /* ==================================================
       MOBILE
    ================================================== */

    @media(max-width:768px){

        .form-header{

            padding:30px 24px;
        }

        .form-title{

            font-size:28px;
        }

        .form-body{

            padding:24px;
        }

        .question-label{

            font-size:15px;
        }
    }

</style>

</head>

<body>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-9">

            <div class="card main-card">

                <div class="form-header">

                    <h1 class="form-title">

                        {{ form.title }}

                    </h1>

                    <p class="form-description">

                        {{ form.description }}

                    </p>

                </div>

                <div class="form-body">

                    <form
                        method="POST"
                        action="/forms/submit-form/{{ form.id }}/"
                        class="needs-validation"
                        novalidate
                    >

                        {% csrf_token %}

                        {% for question in questions %}
                            {% include 'forms_engine/_answer_widget.html' with question=question %}
                        {% endfor %}

                        <button
                            type="submit"
                            class="submit-btn"
                        >

                            <i class="bi bi-send-fill"></i>

                            Submit Form

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<script>
    (() => {
        'use strict'
        const forms = document.querySelectorAll('.needs-validation')
        Array.from(forms).forEach(form => {
            form.addEventListener('submit', event => {
                let firstInvalidInput = null;
                if (!form.checkValidity()) {
                    event.preventDefault()
                    event.stopPropagation()
                }

                form.querySelectorAll('.form-control, .form-select, .form-check-input').forEach(input => {
                    const questionBox = input.closest('.question-box');
                    if (questionBox) {
                        const errorText = questionBox.querySelector('.error-text');
                        const labelEl = questionBox.querySelector('.question-label');
                        let label = 'this field';
                        if (labelEl) {
                            label = labelEl.innerText.replace('*', '').trim();
                        }
                        
                        if (errorText && !input.checkValidity()) {
                            if (!firstInvalidInput) {
                                firstInvalidInput = input;
                            }
                            if (input.validity.valueMissing) {
                                errorText.innerText = 'This field is required';
                            } else if (input.type === 'email' && input.validity.typeMismatch) {
                                errorText.innerText = 'Please enter a valid email address';
                            } else if (input.pattern) {
                                if (input.type === 'tel') {
                                    errorText.innerText = 'Please enter a valid 10-digit mobile number';
                                } else if (input.name && input.placeholder && input.placeholder.includes('PAN')) {
                                    errorText.innerText = 'Please enter a valid PAN number';
                                } else if (input.name && input.placeholder && input.placeholder.includes('Aadhaar')) {
                                    errorText.innerText = 'Please enter a valid 12-digit Aadhaar number';
                                } else if (input.name && input.placeholder && input.placeholder.includes('APAAR')) {
                                    errorText.innerText = 'Please enter a valid 12-digit APAAR ID';
                                } else {
                                    errorText.innerText = 'Your value is wrong, choose another';
                                }
                            } else {
                                errorText.innerText = 'Your value is wrong, choose another';
                            }
                        }
                    }
                });
                
                if (firstInvalidInput) {
                    firstInvalidInput.focus();
                }

                form.classList.add('was-validated')
            }, false)
        })
    })()
</script>

</body>

</html>
