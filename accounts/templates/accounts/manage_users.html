<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>

        Manage Users

    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body{

            background:#f1f5f9;

            font-family:Arial,sans-serif;
        }

        .main-box{

            max-width:1200px;

            margin:auto;

            padding:40px 20px;
        }

        .top-title{

            font-size:34px;

            font-weight:700;

            margin-bottom:35px;
        }

        .form-card,
        .table-card{

            border:none;

            border-radius:24px;
        }

        .submit-btn{

            height:50px;

            border-radius:14px;

            font-weight:600;
        }

    </style>

</head>

<body>

<div class="main-box">

    <div class="top-title">

        User Management

    </div>

    <div class="card shadow-sm form-card mb-5">

        <div class="card-body p-4">

            <h4 class="mb-4">

                Create User

            </h4>

            <form method="POST">

                {% csrf_token %}

                <div class="row g-4">

                    <div class="col-md-6">

                        <label class="form-label">

                            Full Name

                        </label>

                        <input
                            type="text"
                            name="full_name"
                            class="form-control"
                            required
                        >

                    </div>

                    <div class="col-md-6">

                        <label class="form-label">

                            Username

                        </label>

                        <input
                            type="text"
                            name="username"
                            class="form-control"
                            required
                        >

                    </div>

                    <div class="col-md-6">

                        <label class="form-label">

                            Password

                        </label>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            required
                        >

                    </div>

                    <div class="col-md-6">

                        <label class="form-label">

                            Role

                        </label>

                        <select
                            name="role"
                            class="form-select"
                            required
                        >

                            <option value="student">

                                Student

                            </option>

                            <option value="teacher">

                                Teacher

                            </option>

                        </select>

                    </div>

                </div>

                <button
                    type="submit"
                    class="btn btn-primary submit-btn mt-4"
                >

                    Create User

                </button>

            </form>

        </div>

    </div>

    <div class="card shadow-sm table-card">

        <div class="card-body p-4">

            <h4 class="mb-4">

                All Users

            </h4>

            <div class="table-responsive">

                <table class="table align-middle">

                    <thead class="table-dark">

                        <tr>

                            <th>ID</th>

                            <th>Name</th>

                            <th>Username</th>

                            <th>Role</th>

                        </tr>

                    </thead>

                    <tbody>

                        {% for user in users %}

                            <tr>

                                <td>

                                    {{ user.id }}

                                </td>

                                <td>

                                    {{ user.first_name }}

                                </td>

                                <td>

                                    {{ user.username }}

                                </td>

                                <td>

                                    {{ user.role }}

                                </td>

                            </tr>

                        {% endfor %}

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>
<a
    href="/accounts/admin-dashboard/"
    class="btn btn-dark mb-4"
>

    Back To Dashboard

</a>

</body>

</html>
