<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>

        Add Teacher

    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body{
            background:#f1f5f9;
            font-family:'Segoe UI',sans-serif;
        }

        .form-card{
            max-width:700px;
            margin:50px auto;
            background:white;
            padding:40px;
            border-radius:25px;
            box-shadow:0px 10px 30px rgba(0,0,0,0.08);
        }

        .title{
            font-size:32px;
            font-weight:700;
            margin-bottom:30px;
        }

        .btn-save{
            height:50px;
            border-radius:12px;
            font-weight:600;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="form-card">

        <div class="title">

            Add Teacher

        </div>

        <!-- ERROR / SUCCESS MESSAGE -->

        {% if messages %}

            {% for message in messages %}

                <div class="alert alert-danger">

                    {{ message }}

                </div>

            {% endfor %}

        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="row">

                <!-- FIRST NAME -->

                <div class="col-md-6 mb-3">

                    <label>

                        First Name

                    </label>

                    <input
                        type="text"
                        name="first_name"
                        class="form-control"
                        required
                    >

                </div>

                <!-- LAST NAME -->

                <div class="col-md-6 mb-3">

                    <label>

                        Last Name

                    </label>

                    <input
                        type="text"
                        name="last_name"
                        class="form-control"
                    >

                </div>

                <!-- USERNAME -->

                <div class="col-md-6 mb-3">

                    <label>

                        Username

                    </label>

                    <input
                        type="text"
                        name="username"
                        class="form-control"
                        required
                    >

                </div>

                <!-- PASSWORD -->

                <div class="col-md-6 mb-3">

                    <label>

                        Password

                    </label>

                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        required
                    >

                </div>

                <!-- EMAIL -->

                <div class="col-md-6 mb-3">

                    <label>

                        Email

                    </label>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                    >

                </div>

                <!-- PHONE -->

                <div class="col-md-6 mb-3">

                    <label>

                        Phone Number

                    </label>

                    <input
                        type="text"
                        name="phone_number"
                        class="form-control"
                    >

                </div>

                <!-- DEPARTMENT -->

                <div class="col-md-6 mb-3">

                    <label>

                        Department

                    </label>

                    <select
                        name="department"
                        class="form-select"
                    >

                        {% for department in departments %}

                        <option
                            value="{{ department.id }}"
                        >

                            {{ department.name }}

                        </option>

                        {% endfor %}

                    </select>

                </div>

                <!-- ASSIGNED SECTIONS -->

                <div class="col-md-6 mb-3">

                    <label>

                        Assigned Sections

                    </label>

                    <select
                        name="assigned_sections"
                        class="form-select"
                        multiple
                    >

                        {% for section in sections %}

                        <option
                            value="{{ section.id }}"
                        >

                            {{ section.name }}

                        </option>

                        {% endfor %}

                    </select>

                </div>

            </div>

            <!-- BUTTON -->

            <button
                type="submit"
                class="btn btn-success btn-save w-100"
            >

                Save Teacher

            </button>

        </form>

    </div>

</div>

</body>
</html>
