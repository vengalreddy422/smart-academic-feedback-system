<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Teacher</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body style="background:#f1f5f9;">

<div class="container mt-5">

    <div class="card p-4 shadow-lg border-0 rounded-4">

        <h2 class="mb-4">
            Edit Teacher
        </h2>

        <form method="POST">

            {% csrf_token %}

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label>First Name</label>

                    <input
                        type="text"
                        name="first_name"
                        value="{{ teacher.user.first_name }}"
                        class="form-control"
                    >

                </div>

                <div class="col-md-6 mb-3">

                    <label>Last Name</label>

                    <input
                        type="text"
                        name="last_name"
                        value="{{ teacher.user.last_name }}"
                        class="form-control"
                    >

                </div>

                <div class="col-md-6 mb-3">

                    <label>Email</label>

                    <input
                        type="email"
                        name="email"
                        value="{{ teacher.user.email }}"
                        class="form-control"
                    >

                </div>

                <div class="col-md-6 mb-3">

                    <label>Phone</label>

                    <input
                        type="text"
                        name="phone_number"
                        value="{{ teacher.phone_number }}"
                        class="form-control"
                    >

                </div>

                <div class="col-md-6 mb-3">

                    <label>Department</label>

                    <select
                        name="department"
                        class="form-select"
                    >

                        {% for department in departments %}

                            <option
                                value="{{ department.id }}"
                                {% if teacher.department.id == department.id %}
                                    selected
                                {% endif %}
                            >

                                {{ department.name }}

                            </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="col-md-6 mb-3">

                    <label>Assigned Sections</label>

                    <select
                        name="assigned_sections"
                        class="form-select"
                        multiple
                    >

                        {% for section in sections %}

                            <option
                                value="{{ section.id }}"
                                {% if section in teacher.assigned_sections.all %}
                                    selected
                                {% endif %}
                            >

                                {{ section.name }}

                            </option>

                        {% endfor %}

                    </select>

                </div>

            </div>

            <button
                type="submit"
                class="btn btn-warning w-100"
            >
                Update Teacher
            </button>

        </form>

    </div>

</div>

</body>
</html>
